<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t3-desktop wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; }
  #error {
    position: fixed; left: 12px; right: 12px; bottom: 12px; margin: 0; padding: 10px 12px;
    font: 12px/1.4 ui-monospace, monospace; color: #ffd7d7; background: #3a0d10e6;
    border: 1px solid #f07178; border-radius: 6px; white-space: pre-wrap; display: none;
  }
  #hud {
    position: fixed; right: 10px; top: 46px; font: 10px ui-monospace, monospace; color: #ddd6c4aa;
    pointer-events: none; letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<pre id="error"></pre>
<div id="hud"></div>
<script>
const CHROME = '../../src/quickshell/shell/chrome/';
const T3 = { band: 40, border: 4, radius: 13, outerRadius: 17, markSize: 26 };
const params = new URLSearchParams(location.search);
const fixed = params.get('screen')?.match(/^(\d+)x(\d+)$/);

const canvas = document.getElementById('c');
const errorBox = document.getElementById('error');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', { antialias: false });

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

function loadImage(src) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = fail;
    img.src = src + '?' + Date.now();
  });
}

function texture(source, nearest) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  const f = nearest ? gl.NEAREST : gl.LINEAR;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function markCanvas() {
  const scale = 4, size = T3.markSize * scale;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${Math.round(T3.markSize * 15 / 40) * scale}px "DejaVuSansM Nerd Font", "DejaVu Sans Mono", monospace`;
  ctx.fillText('T3', size / 2, size / 2 + size * 0.05);
  return c;
}

const VERT = `#version 300 es
in vec2 pos;
void main() { gl_Position = vec4(pos, 0.0, 1.0); }`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function link(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.bindAttribLocation(p, 0, 'pos');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

let program = null, fragSource = '', palette = {}, textures = {};
const mouse = [-1, -1];
const start = performance.now();

async function reloadShader() {
  try {
    const src = await (await fetch('wallpaper.frag', { cache: 'no-store' })).text();
    if (src === fragSource) return;
    fragSource = src;
    const next = link(src);
    if (program) gl.deleteProgram(program);
    program = next;
    errorBox.style.display = 'none';
  } catch (e) {
    errorBox.textContent = e.message;
    errorBox.style.display = 'block';
  }
}

async function reloadPalette() {
  try {
    const p = await (await fetch(CHROME + 'palette.json', { cache: 'no-store' })).json();
    if (JSON.stringify(p) === JSON.stringify(palette)) return;
    palette = p;
    textures.gradient = texture(await loadImage(CHROME + 'gradient.png'), false);
  } catch (e) {}
}

function size() {
  const dpr = window.devicePixelRatio || 1;
  if (fixed) {
    const w = +fixed[1], h = +fixed[2];
    canvas.width = w; canvas.height = h;
    const fit = Math.min(innerWidth / w, innerHeight / h);
    canvas.style.width = w * fit + 'px';
    canvas.style.height = h * fit + 'px';
  } else {
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  gl.viewport(0, 0, canvas.width, canvas.height);
}

canvas.addEventListener('pointermove', e => {
  const r = canvas.getBoundingClientRect();
  mouse[0] = (e.clientX - r.left) * canvas.width / r.width;
  mouse[1] = (e.clientY - r.top) * canvas.height / r.height;
});
canvas.addEventListener('pointerleave', () => { mouse[0] = mouse[1] = -1; });

function frame() {
  if (program && textures.gradient) {
    gl.useProgram(program);
    const u = n => gl.getUniformLocation(program, n);
    const w = canvas.width, h = canvas.height;
    gl.uniform2f(u('screenSize'), w, h);
    gl.uniform2f(u('mouse'), mouse[0], mouse[1]);
    gl.uniform1f(u('time'), (performance.now() - start) / 1000);
    gl.uniform1f(u('bandHeight'), T3.band);
    gl.uniform1f(u('border'), T3.border);
    gl.uniform1f(u('radius'), T3.radius);
    gl.uniform1f(u('outerRadius'), T3.outerRadius);
    gl.uniform3fv(u('ground'), hex(palette.ground || '#0b0f12'));
    gl.uniform3fv(u('accent'), hex(palette.accent || '#1d9eb6'));
    gl.uniform4f(u('markRect'), Math.round(w / 2 - T3.markSize / 2), Math.round((T3.band - T3.markSize) / 2), T3.markSize, T3.markSize);
    [['noiseTex', 'noise'], ['dotsTex', 'dots'], ['grainTex', 'grain'], ['gradientTex', 'gradient'], ['markTex', 'mark'], ['ampTex', 'amp']]
      .forEach(([name, key], i) => {
        gl.activeTexture(gl.TEXTURE0 + i);
        gl.bindTexture(gl.TEXTURE_2D, textures[key]);
        gl.uniform1i(u(name), i);
      });
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    hud.textContent = `${w}×${h}`;
  }
  requestAnimationFrame(frame);
}

(async () => {
  gl.bindVertexArray(gl.createVertexArray());
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  textures.noise = texture(await loadImage(CHROME + 'noise.png'), false);
  textures.dots = texture(await loadImage(CHROME + 'dots.png'), false);
  textures.grain = texture(await loadImage(CHROME + 'grain.png'), true);
  textures.amp = texture(await loadImage(CHROME + 'andamp_sdf.png'), false);
  await document.fonts.ready;
  textures.mark = texture(markCanvas(), false);
  size();
  addEventListener('resize', size);
  await reloadPalette();
  await reloadShader();
  setInterval(reloadShader, 300);
  setInterval(reloadPalette, 1000);
  frame();
})();
</script>
</body>
</html>
